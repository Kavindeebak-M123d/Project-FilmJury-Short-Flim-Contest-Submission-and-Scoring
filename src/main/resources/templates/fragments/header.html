<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | FilmJury Contest'">FilmJury – Short Film Contest Management System</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom Cinema CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-cinema sticky-top">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fa-solid fa-film text-warning"></i>
                Film<span>Jury</span>
            </a>
            <button class="navbar-toggler navbar-dark border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI == '/'} ? 'active' : ''">
                            <i class="fa-solid fa-house me-1"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/entries/new}" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI == '/entries/new'} ? 'active' : ''">
                            <i class="fa-solid fa-paper-plane me-1"></i> Submit Film
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/entries}" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI == '/entries'} ? 'active' : ''">
                            <i class="fa-solid fa-video me-1"></i> Entries
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/judges}" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI == '/judges'} ? 'active' : ''">
                            <i class="fa-solid fa-user-ninja me-1"></i> Judges
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/criteria}" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI == '/criteria'} ? 'active' : ''">
                            <i class="fa-solid fa-list-check me-1"></i> Criteria
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/leaderboard}" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI == '/leaderboard'} ? 'active' : ''">
                            <i class="fa-solid fa-trophy me-1"></i> Leaderboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/dashboard}" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI == '/dashboard'} ? 'active' : ''">
                            <i class="fa-solid fa-chart-line me-1"></i> Dashboard
                        </a>
                    </li>
                </ul>
                <div class="d-flex gap-2">
                    <a th:href="@{/entries/new}" class="btn btn-gold btn-sm"><i class="fa-solid fa-plus me-1"></i> Submit Film</a>
                </div>
            </div>
        </div>
    </nav>
</body>
</html>
