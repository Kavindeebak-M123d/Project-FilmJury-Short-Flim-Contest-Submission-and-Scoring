<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Judge Management')}"></head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="container my-4">
        <!-- Flash Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show bg-dark border-success text-success mb-4" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i><span th:text="${successMessage}"></span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show bg-dark border-danger text-danger mb-4" role="alert">
            <i class="fa-solid fa-circle-exclamation me-2"></i><span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            <!-- Add / Edit Form Column -->
            <div class="col-lg-4">
                <div class="cinema-card">
                    <div class="cinema-card-header">
                        <h5 class="text-white mb-0">
                            <i class="fa-solid fa-user-ninja text-warning me-2"></i>
                            <span th:text="${isEdit != null and isEdit} ? 'Edit Judge Details' : 'Add New Judge'">Add New Judge</span>
                        </h5>
                    </div>
                    <div class="cinema-card-body">
                        <form th:action="${isEdit != null and isEdit} ? @{/judges/edit/{id}(id=${judge.id})} : @{/judges}" 
                              th:object="${judge}" method="post">
                            
                            <div class="mb-3">
                                <label class="form-label text-light">Judge Name <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{name}" class="form-control form-control-cinema" 
                                       placeholder="e.g. Christopher Nolan" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label text-light">Email Address <span class="text-danger">*</span></label>
                                <input type="email" th:field="*{email}" class="form-control form-control-cinema" 
                                       placeholder="judge@filmjury.org" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Invalid email address.</div>
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a th:if="${isEdit != null and isEdit}" th:href="@{/judges}" class="btn btn-cinema-action btn-sm">Cancel</a>
                                <button type="submit" class="btn btn-gold w-100">
                                    <i class="fa-solid fa-user-check me-1"></i>
                                    <span th:text="${isEdit != null and isEdit} ? 'Update Judge' : 'Add Judge'">Add Judge</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Judges Table Column -->
            <div class="col-lg-8">
                <div class="cinema-card">
                    <div class="cinema-card-header d-flex justify-content-between align-items-center">
                        <h5 class="text-white mb-0"><i class="fa-solid fa-users text-warning me-2"></i>Contest Jury Members</h5>
                        <span class="badge bg-secondary" th:text="${judges.size()} + ' Total Judges'">0 Total</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-cinema align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Assigned Films</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="j, stat : ${judges}">
                                    <td class="text-muted fw-bold" th:text="${stat.count}">1</td>
                                    <td class="fw-bold text-white" th:text="${j.name}">Judge Name</td>
                                    <td class="text-info" th:text="${j.email}">email@domain.com</td>
                                    <td>
                                        <span class="badge bg-dark border border-warning text-warning" th:text="${j.entries.size()} + ' Films'">0 Films</span>
                                    </td>
                                    <td class="text-end">
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{/judges/edit/{id}(id=${j.id})}" class="btn btn-cinema-action"><i class="fa-solid fa-pen"></i></a>
                                            <a th:href="@{/judges/delete/{id}(id=${j.id})}" onclick="return confirm('Are you sure you want to remove this judge?');" class="btn btn-outline-danger"><i class="fa-solid fa-trash"></i></a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${judges == null or judges.empty}">
                                    <td colspan="5" class="text-center text-muted py-4">No judges registered yet. Use the form on the left to add your first judge.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
